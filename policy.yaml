version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /proc, /dev/urandom, /etc]
  read_write: [/sandbox, /tmp, /dev/null, /dev/pts]
landlock:
  compatibility: best_effort
process:
  run_as_user: "1001"
  run_as_group: "1001"
network_policies:
  m365_write:
    name: microsoft-graph-draft-write
    endpoints:
      - host: graph.microsoft.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /sandbox/proxy-m365-write
